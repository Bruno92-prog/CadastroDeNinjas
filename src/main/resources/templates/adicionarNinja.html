<!
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adicionar Novo Ninja</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =========================================
           PÁGINA
        ========================================= */

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================================
           TÍTULO PRINCIPAL
        ========================================= */

        h1 {
            text-align: center;
            color: #172033;
            font-size: 32px;
            margin-bottom: 28px;
        }

        /* =========================================
           CONTAINER DO FORMULÁRIO
        ========================================= */

        .form-container {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
            display: flex;
            flex-direction: column;
        }

        /* =========================================
           MENSAGEM DE SUCESSO / ALERTA
        ========================================= */

        .mensagem {
            background: #dcfce7;
            color: #15803d;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            border: 1px solid #bbf7d0;
        }

        /* =========================================
           CAMPOS DO FORMULÁRIO
        ========================================= */

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
            margin-top: 14px;
        }

        label:first-of-type {
            margin-top: 0;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #1f2937;
            background: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            background: #ffffff;
            border-color: #4338ca;
            box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.15);
        }

        /* =========================================
           BOTÃO DE SUBMIT
        ========================================= */

        button[type="submit"] {
            margin-top: 25px;
            padding: 12px;
            background: #1e293b;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.15);
        }

        button[type="submit"]:hover {
            background: #334155;
            transform: translateY(-2px);
        }

        /* =========================================
           BOTÃO VOLTAR
        ========================================= */

        .form-container > a {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .form-container > a:hover {
            color: #1e293b;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<h1>Adicionar Novo Ninja</h1>
<div class="form-container">
    <div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>
    <form th:action="@{/ninjas/ui/salvar}" th:object="${ninja}" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required />

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required />

        <label for="imgUrl">URL da Imagem:</label>
        <input type="text" id="imgUrl" th:field="*{imgUrl}" required />

        <label for="idade">Idade:</label>
        <input type="number" id="idade" th:field="*{idade}" required />

        <label for="rank">Rank:</label>
        <input type="text" id="rank" th:field="*{rank_ninja}" />

        <button type="submit">Cadastrar Ninja</button>
    </form>
    <a th:href="@{/ninjas/ui/listar}">Voltar para a lista de ninjas</a>
</div>
</body>
</html>
