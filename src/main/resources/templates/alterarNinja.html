<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alterar Ninja</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f6f9; color: #1f2937; padding: 35px 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { text-align: center; color: #172033; font-size: 32px; margin-bottom: 28px; }
        .form-container { background: #ffffff; width: 100%; max-width: 550px; padding: 35px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.07); display: flex; flex-direction: column; }
        form { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: 700; color: #1e293b; text-transform: uppercase; margin-bottom: 6px; margin-top: 14px; }
        label:first-of-type { margin-top: 0; }
        input[type="text"], input[type="email"], input[type="number"] { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #f8fafc; outline: none; }
        input:focus { background: #ffffff; border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }
        button[type="submit"] { margin-top: 25px; padding: 12px; background: #f59e0b; color: #ffffff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
        button[type="submit"]:hover { background: #d97706; }
        .form-container > a { display: block; text-align: center; margin-top: 18px; color: #64748b; text-decoration: none; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

<h1>Alterar Dados do Ninja</h1>

<div class="form-container">
    <form th:action="@{/ninjas/ui/salvar}" th:object="${ninja}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required />

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required />

        <label for="imgUrl">URL da Imagem:</label>
        <input type="text" id="imgUrl" th:field="*{imgUrl}" required />

        <label for="idade">Idade:</label>
        <input type="number" id="idade" th:field="*{idade}" required />

        <label for="rank">Rank:</label>
        <input type="text" id="rank" th:field="*{rank_ninja}" />

        <button type="submit">Salvar Alterações</button>
    </form>
    <a th:href="@{/ninjas/ui/listar}">Voltar para a lista de ninjas</a>
</div>

</body>
</html>
